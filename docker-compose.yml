services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: guideops-sqlserver
    environment:
      SA_PASSWORD: "GuideOps@Dev2026!"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql

volumes:
  sqlserver-data:
